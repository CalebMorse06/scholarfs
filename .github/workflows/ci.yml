name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and schema tests
        run: python -m unittest discover -s tests -v
      - name: Validate the fake semester
        run: scholarfs validate examples/fall-2026 --strict

  package:
    name: Build and smoke-install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-install wheel without dependencies
        run: |
          python -m venv /tmp/scholarfs-smoke
          /tmp/scholarfs-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/scholarfs-smoke/bin/scholarfs --version
          /tmp/scholarfs-smoke/bin/scholarfs --help
